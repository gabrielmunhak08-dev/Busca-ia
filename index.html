<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Busca IA</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
    min-height: 100vh;
}

.aplicativo {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
}

/* CABEÇALHO */

.cabecalho {
    padding: 22px 20px;
    text-align: center;
    border-bottom: 1px solid #24242c;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.logo span {
    color: #6c63ff;
}

.subtitulo {
    margin-top: 7px;
    color: #999;
    font-size: 14px;
}

/* CHAT */

.chat {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.mensagem {
    margin-bottom: 18px;
    padding: 15px;
    border-radius: 15px;
    max-width: 90%;
    line-height: 1.5;
}

.ia {
    background: #17171f;
    border: 1px solid #292933;
}

.usuario {
    background: #6c63ff;
    margin-left: auto;
}

.label {
    font-size: 12px;
    font-weight: bold;
    color: #8b83ff;
    margin-bottom: 8px;
}

/* ÁREA DE PERGUNTA */

.area-pergunta {
    padding: 15px;
    border-top: 1px solid #24242c;
    background: #0b0b0f;
}

form {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    height: 52px;
    border: 1px solid #30303a;
    border-radius: 14px;
    background: #15151c;
    color: white;
    padding: 0 16px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #6c63ff;
}

button {
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 14px;
    background: #6c63ff;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

button:disabled {
    opacity: 0.5;
}

/* BOTÕES RÁPIDOS */

.acoes {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 10px;
}

.acao {
    white-space: nowrap;
    width: auto;
    height: 38px;
    padding: 0 14px;
    font-size: 13px;
    background: #17171f;
    border: 1px solid #30303a;
}

.acao:hover {
    background: #22222c;
}

/* RODAPÉ */

.rodape {
    text-align: center;
    color: #666;
    font-size: 11px;
    padding: 8px;
}
</style>
</head>

<body>

<div class="aplicativo">

    <header class="cabecalho">
        <div class="logo">
            Busca <span>IA</span>
        </div>

        <div class="subtitulo">
            Seu assistente inteligente
        </div>
    </header>


    <main class="chat" id="chat">

        <div class="mensagem ia">

            <div class="label">
                Busca IA
            </div>

            <div>
                Olá! 👋<br><br>
                Eu sou o Busca IA. Pode me fazer uma pergunta,
                pedir uma explicação ou pesquisar uma ideia.
            </div>

        </div>

    </main>


    <section class="area-pergunta">

        <div class="acoes">

            <button
                class="acao"
                onclick="perguntaRapida('Me explique uma coisa de forma simples')">
                💡 Explicar
            </button>

            <button
                class="acao"
                onclick="perguntaRapida('Me dê uma ideia')">
                💭 Ideia
            </button>

            <button
                class="acao"
                onclick="perguntaRapida('Faça um resumo')">
                📝 Resumo
            </button>

        </div>


        <form id="formulario">

            <input
                id="entrada"
                type="text"
                placeholder="Digite sua pergunta..."
                autocomplete="off"
            >

            <button id="enviar" type="submit">
                ➤
            </button>

        </form>

        <div class="rodape">
            Busca IA • Projeto experimental
        </div>

    </section>

</div>


<script>

const formulario = document.getElementById("formulario");
const entrada = document.getElementById("entrada");
const chat = document.getElementById("chat");
const enviar = document.getElementById("enviar");


function adicionarMensagem(texto, tipo) {

    const mensagem = document.createElement("div");

    mensagem.className = "mensagem " + tipo;

    if (tipo === "ia") {

        mensagem.innerHTML = `
            <div class="label">
                Busca IA
            </div>

            <div>
                ${texto}
            </div>
        `;

    } else {

        mensagem.innerHTML = texto;

    }

    chat.appendChild(mensagem);

    chat.scrollTop = chat.scrollHeight;
}


function responder(pergunta) {

    const texto = pergunta.toLowerCase();

    if (
        texto.includes("olá") ||
        texto.includes("oi") ||
        texto.includes("ola")
    ) {

        return "Olá! 😎 Como posso te ajudar?";

    }


    if (texto.includes("quem é você")) {

        return "Eu sou o Busca IA, um assistente criado para responder perguntas e ajudar você.";

    }


    if (texto.includes("programação") ||
        texto.includes("programar")) {

        return "Programação é basicamente ensinar o computador a executar tarefas usando código. 💻";

    }


    if (texto.includes("ideia")) {

        return "Uma ideia: podemos transformar o Busca IA em um aplicativo completo, com pesquisa, histórico de conversas e várias ferramentas. 🚀";

    }


    if (texto.includes("resumo")) {

        return "Claro! Me envie o texto que você quer resumir e eu preparo uma versão mais curta.";

    }


    return "Ainda estamos preparando meus recursos de IA. 🤖\n\nSua pergunta foi recebida: \"" 
        + pergunta + "\"\n\nEm breve podemos conectar este projeto a uma inteligência artificial de verdade.";

}


function enviarPergunta(pergunta) {

    if (!pergunta.trim()) {
        return;
    }

    adicionarMensagem(pergunta, "usuario");

    entrada.value = "";

    enviar.disabled = true;

    adicionarMensagem(
        "Pensando... 🤔",
        "ia"
    );

    setTimeout(function() {

        const mensagensIA =
            document.querySelectorAll(".mensagem.ia");

        const ultima =
            mensagensIA[mensagensIA.length - 1];

        ultima.innerHTML = `
            <div class="label">
                Busca IA
            </div>

            <div>
                ${responder(pergunta)}
            </div>
        `;

        enviar.disabled = false;

        entrada.focus();

        chat.scrollTop = chat.scrollHeight;

    }, 1000);

}


formulario.addEventListener("submit", function(event) {

    event.preventDefault();

    enviarPergunta(entrada.value);

});


function perguntaRapida(texto) {

    entrada.value = texto;

    entrada.focus();

}


</script>

</body>
</html>
